<!DOCTYPE html>
<html>
<head>
    <title>Supabase Connection Test</title>
</head>
<body>
    <h1>Testing Supabase Connection...</h1>
    <div id="result"></div>
    <script type="module">
        const SUPABASE_URL = "https://tdjtumtdkjicnhlpqqzd.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkanR1bXRka2ppY25obHBxcXpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjExNzIxNzMsImV4cCI6MjA3Njc0ODE3M30.jwQgnjHjz2v2w9-mKVKMy8mT8Q9VgknxFammzW4V9ng";

        async function testConnection() {
            const result = document.getElementById('result');
            
            try {
                // Test 1: Basic connection
                result.innerHTML += '<p>Testing basic connection...</p>';
                const response = await fetch(`${SUPABASE_URL}/rest/v1/`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                if (response.ok) {
                    result.innerHTML += '<p style="color: green;">✓ Supabase connection OK</p>';
                } else {
                    result.innerHTML += `<p style="color: red;">✗ Supabase connection failed: ${response.status}</p>`;
                }

                // Test 2: Check Google OAuth provider
                result.innerHTML += '<p>Checking auth providers...</p>';
                const authResponse = await fetch(`${SUPABASE_URL}/auth/v1/settings`, {
                    headers: {
                        'apikey': SUPABASE_KEY
                    }
                });
                
                if (authResponse.ok) {
                    const settings = await authResponse.json();
                    result.innerHTML += '<p style="color: green;">✓ Auth settings loaded</p>';
                    result.innerHTML += '<pre>' + JSON.stringify(settings, null, 2) + '</pre>';
                } else {
                    result.innerHTML += `<p style="color: red;">✗ Auth settings failed: ${authResponse.status}</p>`;
                }
            } catch (error) {
                result.innerHTML += `<p style="color: red;">✗ Error: ${error.message}</p>`;
            }
        }

        testConnection();
    </script>
</body>
</html>
